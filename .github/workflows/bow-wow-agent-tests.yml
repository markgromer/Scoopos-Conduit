name: Bow Wow AI Agent Starter Tests
on:
  push:
    paths:
      - "workshops/2026-10-12-build-an-agent/agent-starter/**"
      - "workshops/2026-10-12-build-an-agent/builder/**"
      - ".github/workflows/bow-wow-agent-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/2026-10-12-build-an-agent/agent-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test agent engine and human-approval protections
        run: npm test
      - name: Test blueprint backup import and export
        run: node --test ../builder/tests/blueprint-backup.test.mjs
